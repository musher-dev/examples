name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. These examples exist to work, and the way they stop working is a
    # base image or a registry changing under them — which no PR would catch.
    # Drift in the API and the specifications is upstream.yml's job.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The checks' own tools, pinned like everything else here.
  CHECK_JSONSCHEMA_VERSION: "0.38.1"
  JSONSCHEMA_VERSION: "4.23.0"

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # Any top-level directory carrying a Dockerfile is an example.
        run: |
          examples=$(find . -maxdepth 2 -name Dockerfile -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
          echo "Found: $examples"

  build:
    name: Build ${{ matrix.example }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.example }}
          push: false
          load: true
          tags: musher-examples/${{ matrix.example }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers its readiness probe
        env:
          EXAMPLE: ${{ matrix.example }}
        run: sh scripts/ci/smoke.sh "$EXAMPLE"

  specs:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored contracts match their pins
        # A hand-edited schema or OpenAPI copy, or a pin bumped without its
        # file, fails here. scripts/pins/update.sh is the only way to change them.
        run: sh scripts/pins/verify.sh
      - name: Install check-jsonschema
        run: pipx install "check-jsonschema==$CHECK_JSONSCHEMA_VERSION"
      - name: Every document validates against the pinned specification
        run: sh scripts/check/specs.sh

  api:
    name: API calls match the pinned OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every route the script and READMEs call exists
        run: python3 scripts/check/api-routes.py
      - name: The apply script's requests validate against the OpenAPI
        # Runs scripts/musher-apply.sh against a local fake that refuses any
        # request the pinned OpenAPI would. No credentials, no network.
        run: |
          python3 -m pip install --quiet "jsonschema==$JSONSCHEMA_VERSION"
          python3 scripts/check/contract-test.py

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # POSIX sh: the apply script runs on whatever /bin/sh a reader has.
      - run: shellcheck --shell=sh scripts/*.sh scripts/*/*.sh

  required:
    name: CI / required
    if: always()
    needs: [build, specs, api, shell]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job reported '$r'"; exit 1; }
          done
