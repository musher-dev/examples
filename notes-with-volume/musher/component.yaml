# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# Adds storage. `volumes` declares a claim the platform materialises as a real
# Volume and mounts at `mountPath` — data written there survives restarts,
# redeploys, and the instance moving to a different machine.
#
# The claim is declared here, on the Component, because the Component knows
# what the workload needs to keep and where it writes it. The Blueprint
# allocates the size, at or above the minimum declared here — the same split as
# compute: the Component says what it needs, the Blueprint says how much.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Notes API that keeps its notes on a persistent volume mounted at /data.
spec:
  type: SERVICE
  workload:
    source:
      image: this-dockerfile.invalid/notes-with-volume
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      data:
        mountPath: /data
        # The smallest allocation this workload can run with. A Blueprint may
        # allocate more, never less.
        minSizeGiB: 1
        # `shared: false`, the default, gives this node its own volume,
        # mounted into one replica at a time — including while it is replaced.
        # That is why this example deploys with replicas: 1; a second replica
        # would want the same single-attach volume.
        #
        # `shared: true` is the alternative every replica mounts at once.
        # Reach for it when replicas must see the same files; reach for a
        # database when they must agree on the same records.
        shared: false
        readOnly: false
  contract:
    inputs:
      dataDir:
        description: Directory the notes file is written to. Must be on the volume.
        schema:
          type: string
        default: /data
        target:
          envVar: DATA_DIR
    outputs: {}
