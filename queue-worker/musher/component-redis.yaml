# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# The same public-image wrapper as counter-with-cache. One output, two
# consumers this time.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Unauthenticated Redis on a private endpoint, used as a job queue by sibling nodes.
spec:
  type: SERVICE
  workload:
    source:
      image: redis:7.4.2-alpine
    endpoints:
      primary:
        targetPort: 6379
        protocol: TCP
  contract:
    inputs: {}
    outputs:
      url:
        description: Mesh-internal Redis URL for sibling nodes in this deployment.
        schema:
          type: string
        presentationHint: CONNECTION_STRING
        from:
          template: redis://${{ self.endpoints.primary.privateAddress }}
