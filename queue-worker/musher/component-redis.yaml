# yaml-language-server: $schema=https://api.musher.dev/v1/schemas/component-create
#
# The same public-image wrapper as counter-with-cache. One output, two
# consumers this time.
specVersion: v1
kind: COMPONENT
metadata:
  slug: queue-redis
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: redis:7.4.2-alpine
    endpoints:
      primary:
        containerPort: 6379
        protocol: TCP
        visibility: PRIVATE
    envVars: []
  contract:
    inputs: {}
    outputs:
      url:
        schema:
          type: STRING
          format: CONNECTION_STRING
          semanticType: REDIS
        valueFrom: DECLARED
        value: redis://{{ self.privateAddress.primary }}
        description: Mesh-internal Redis URL for sibling nodes in this deployment.
