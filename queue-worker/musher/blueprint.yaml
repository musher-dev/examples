# yaml-language-server: $schema=https://specifications.musher.dev/blueprint/v2/blueprint.schema.json
#
# Three nodes, two wires — and one output feeding both consumers. An output is
# not consumed by being wired; it can satisfy as many inputs as ask for it.
specVersion: v2
kind: BLUEPRINT
metadata:
  slug: queue-worker
  revision: 1
  description: A public job API and a worker, sharing one private Redis queue.
spec:
  nodes:
    queue:
      componentRef: ./component-redis.yaml
      compute:
        profile: general.standard.small
    api:
      componentRef: ./component-api.yaml
      compute:
        profile: general.standard.small
      exposure:
        primary: PUBLIC
      bindings:
        queueUrl:
          node: queue
          output: url
    worker:
      componentRef: ./component-worker.yaml
      # A WORKER runs, so it needs compute like any SERVICE. Only an EXTERNAL
      # node, which runs nothing, carries none.
      compute:
        profile: general.standard.small
      bindings:
        queueUrl:
          node: queue
          output: url
  parameters: {}
