# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# The front door: a SERVICE with an endpoint that accepts work and reports
# results. Same image as the worker, different ROLE.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: HTTP API that queues jobs in Redis and reports their results.
spec:
  type: SERVICE
  workload:
    source:
      image: this-dockerfile.invalid/queue-worker
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      role:
        description: Which half of the app this process runs, api or worker.
        schema:
          type: string
          enum: [api]
        default: api
        target:
          envVar: ROLE
      queueKey:
        description: Redis list the jobs are pushed onto.
        schema:
          type: string
        default: jobs
        target:
          envVar: QUEUE_KEY
      queueUrl:
        description: Redis URL this service pushes jobs onto.
        schema:
          type: string
        presentationHint: CONNECTION_STRING
        target:
          envVar: REDIS_URL
    outputs: {}
