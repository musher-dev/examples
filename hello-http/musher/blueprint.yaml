# yaml-language-server: $schema=https://specifications.musher.dev/blueprint/v2/blueprint.schema.json
#
# A Blueprint composes one or more Components into the thing you actually
# deploy. A single-service app is just a one-Component Blueprint — there is no
# separate "simple" path to outgrow later.
specVersion: v2
kind: BLUEPRINT
metadata:
  # The Blueprint's name in your library. scripts/musher-apply.sh creates it on
  # the first run and adds a revision on every later one.
  slug: hello-http
  revision: 1
  description: The hello-http service, publicly reachable, on one small node.
spec:
  nodes:
    # The map key is the node name. It becomes the leading label of this node's
    # hostname, so it must be a DNS label: lowercase, starting with a letter.
    web:
      # A path to the Component file, relative to this one. The API names a
      # Component by its id and revision instead, which you do not have until
      # the Component is published — so scripts/musher-apply.sh publishes it,
      # then rewrites this to its id and adds `revision`. A Blueprint pins an
      # exact revision on purpose: publishing a new Component revision never
      # silently changes a running Blueprint.
      componentRef: ./component.yaml
      # Compute is bound per node, here, not on the Component — the same
      # Component can run small in one Blueprint and large in another.
      compute:
        profile: general.standard.small
      # Exposure is the Blueprint's call too. An endpoint left out is PRIVATE;
      # PUBLIC gets a routable URL, and requires the readiness probe the
      # Component declares.
      exposure:
        primary: PUBLIC
  parameters: {} # nothing to ask the deployer for
