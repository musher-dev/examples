# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# A Component is the reusable, versioned definition of one workload. It is a
# definition, not a running app — you deploy a Blueprint, and a Blueprint
# references Components.
#
# `this-dockerfile.invalid/...` stands for the image built from this example's
# Dockerfile. scripts/musher-apply.sh replaces it with the image you built and
# pushed, so nothing in this file needs editing. It is a real image reference,
# so the file stays a valid document, and `.invalid` is a domain that never
# resolves, so a copy applied without the substitution fails loudly instead of
# pulling someone else's image.
specVersion: v2
kind: COMPONENT
metadata:
  # A Component document has no slug: a Blueprint names it by its file, and
  # the apply script names it in your library after its file and example.
  #
  # `revision` orders this Component's publications and must rise with each
  # one. The apply script replaces it with the next free revision, so
  # re-applying after an edit gives you revision 2 rather than a conflict, and
  # revision 1 keeps serving until you deploy revision 2.
  revision: 1
  # Required to publish. It is what someone composing a Blueprint reads.
  description: Minimal HTTP service with one endpoint and a readiness probe.
spec:
  type: SERVICE # SERVICE | WORKER | JOB | EXTERNAL
  workload:
    source:
      image: this-dockerfile.invalid/hello-http
    endpoints:
      primary:
        # The port the process listens on. The public port is the platform's to
        # allocate, never yours.
        targetPort: 8080
        # Required — there is no default protocol.
        protocol: HTTP
        # Note what is absent: visibility. A Component declares endpoints; the
        # Blueprint decides which of them are public.
    health:
      # A Blueprint that exposes this endpoint PUBLIC must find a readiness
      # probe here. Musher holds traffic off an instance until it passes, so it
      # is also what makes a redeploy seamless rather than a brief 502.
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    # The contract is how a Component talks to the outside world: `inputs` are
    # values it needs, `outputs` are values it offers to other Components.
    # This one needs nothing and offers nothing — see configurable-greeter for
    # inputs, and counter-with-cache for wiring outputs into inputs.
    inputs: {}
    outputs: {}
