# yaml-language-server: $schema=https://specifications.musher.dev/blueprint/v2/blueprint.schema.json
#
# The deploy form is authored here, in `parameters`, not derived from the
# Component. A parameter is a value from outside the documents, and a node
# reaches it through a `parameter` binding.
specVersion: v2
kind: BLUEPRINT
metadata:
  slug: configurable-greeter
  revision: 1
  description: The configurable greeter, with a greeting on the deploy form and a generated admin token.
spec:
  nodes:
    web:
      componentRef: ./component.yaml
      compute:
        profile: general.standard.small
      exposure:
        primary: PUBLIC
      bindings:
        greeting:
          parameter: greeting
        adminToken:
          parameter: adminToken
        # `buildChannel` is not bound, so it takes the Component's default.
  parameters:
    greeting:
      # A submitted parameter: `ui` puts it on the deploy form, and `default`
      # is what a deployer who changes nothing gets. A parameter declares no
      # schema of its own; the inputs it binds own the value schema.
      ui:
        label: Greeting
      default: Hello from Musher
    adminToken:
      # A generated parameter. The platform mints `byteLength` random bytes at
      # deploy time and encodes them; the deployer never types it, and
      # submitting a value for it is refused. Its `ui` label is not a form
      # field — a generated parameter never is one. It is what lets the people
      # who manage the deployment reveal the token later; without a label the
      # value is the workload's alone.
      generator:
        byteLength: 32
        encoding: BASE64URL # HEX | BASE64 | BASE64URL
      ui:
        label: Admin token
