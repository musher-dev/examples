# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# The same workload as hello-http, plus a contract. `contract.inputs` is what
# turns a fixed image into something a deployment configures — each input lands
# in the container as the environment variable named by `target.envVar`, and
# nothing else writes the container's environment.
#
# The Component only says what it needs. Where each value comes from — the
# deploy form, a generated secret, another node — is the Blueprint's to say.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: HTTP greeter whose greeting, release channel and admin token arrive as inputs.
spec:
  type: SERVICE
  workload:
    source:
      image: this-dockerfile.invalid/configurable-greeter
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      buildChannel:
        # A value that does not vary between deployments is still an input: one
        # with a `default`. A Blueprint that binds nothing to it gets the
        # default, and nobody is asked. Use these for runtime facts, never for
        # anything secret. A value that must never be overridden belongs in the
        # image instead.
        description: Release channel the service reports on its home page.
        schema:
          type: string
        default: stable
        target:
          envVar: BUILD_CHANNEL

      greeting:
        # A plain input with a default. The Blueprint offers it on the deploy
        # form, so a deployer can accept the default and move on.
        description: Shown on the home page. Change it and redeploy to see it update.
        schema:
          type: string
          minLength: 1
        default: Hello from Musher
        target:
          envVar: GREETING

      adminToken:
        # A secret. `sensitive` keeps the value masked everywhere the platform
        # shows it. A sensitive input must not carry a `default`: a default
        # would be published with this document, which is exactly what a secret
        # must not be. The Blueprint feeds it from a generated parameter, so
        # the value is minted at deploy time and is never in this repository or
        # in the image.
        description: Token the /admin route requires. Generated per deployment.
        schema:
          type: string
        sensitive: true
        target:
          envVar: ADMIN_TOKEN
    outputs: {}
