# yaml-language-server: $schema=https://api.musher.dev/v1/schemas/component-create
#
# The workload this repository builds. It declares that it needs a cache URL,
# and says nothing about where that URL comes from — the Blueprint decides.
specVersion: v1
kind: COMPONENT
metadata:
  slug: counter-web
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: ${IMAGE_REF}
    endpoints:
      primary:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        # This probe talks to the cache. An instance that cannot reach its
        # cache cannot serve a request, so it should not be in rotation —
        # see the note in src/app.py.
        path: /healthz
        endpoint: primary
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    envVars:
      - key: COUNTER_KEY
        value:
          type: LITERAL
          value: visits
  contract:
    inputs:
      # A declared need, not a configuration value. `suppliedBy: CONNECTION`
      # means no human ever types this — it is filled by wiring the graph, and
      # a Blueprint that leaves it unwired will not publish.
      #
      # Note what is absent: no `ui` block, because there is no install-form
      # field for it. That is enforced, not conventional.
      cacheUrl:
        schema:
          type: STRING
          format: CONNECTION_STRING
          semanticType: REDIS
        suppliedBy: CONNECTION
        isRequired: true
        # Where the resolved value lands in the container. Without a target
        # the wire would validate and resolve to nothing the process can read.
        target:
          envVarKey: REDIS_URL
        description: Redis URL this service increments its counter in.
    outputs: {}
