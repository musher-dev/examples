# yaml-language-server: $schema=https://specifications.musher.dev/component/v2/component.schema.json
#
# A Component you do not build. This wraps the public Redis image and declares
# what it offers the rest of the graph — which is the whole reason backing
# services are Components and not a special kind of platform add-on.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Unauthenticated Redis cache on a private endpoint, for sibling nodes of one deployment.
spec:
  type: SERVICE
  workload:
    source:
      # Pinned, like every image reference you should write. Musher accepts a
      # moving tag such as `redis:alpine`, but then two deployments of the same
      # revision can run different code; only a version (or a digest) says what
      # you tested. CI in this repository rejects floating tags.
      image: redis:7.4.2-alpine
    endpoints:
      primary:
        targetPort: 6379
        protocol: TCP
        # No exposure is declared here, and the Blueprint leaves this endpoint
        # out of its `exposure`, so it is PRIVATE: reachable by sibling nodes
        # in this deployment, never routable from the internet. A cache with a
        # public URL is a cache someone else is using.
        #
        # No readiness probe either. Only a PUBLIC URL-addressed endpoint must
        # declare one, and a probe needs an HTTP endpoint to ask.
  contract:
    inputs: {}
    outputs:
      # What this node publishes for consumers to wire.
      #
      # A `template` builds a string from this node's own endpoints:
      # `${{ self.endpoints.primary.privateAddress }}` resolves to the mesh
      # `host:port` of the endpoint named `primary`. `self` can only ever
      # reference this node's own endpoints, never something it was handed over
      # a wire, which is what lets Musher resolve every node's addresses before
      # wiring any of them.
      url:
        description: Mesh-internal Redis URL for sibling nodes in this deployment.
        schema:
          type: string
        # A hint for how to present the value; it asserts nothing. A Redis URL
        # and a Postgres DSN are both strings, and the platform only checks that
        # the two ends of a wire have the same logical type — so the input's
        # description is what tells a reader which URL it wants.
        presentationHint: CONNECTION_STRING
        from:
          template: redis://${{ self.endpoints.primary.privateAddress }}
