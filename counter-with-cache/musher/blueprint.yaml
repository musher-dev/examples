# yaml-language-server: $schema=https://specifications.musher.dev/blueprint/v2/blueprint.schema.json
#
# Two nodes and one wire. This is the file that makes them an application
# rather than two containers that happen to be deployed together.
specVersion: v2
kind: BLUEPRINT
metadata:
  slug: counter-with-cache
  revision: 1
  description: A public visit counter wired to a private Redis cache.
spec:
  nodes:
    cache:
      componentRef: ./component-cache.yaml
      compute:
        profile: general.standard.small
      # No `exposure`: the cache's endpoint stays PRIVATE.
    web:
      componentRef: ./component-web.yaml
      compute:
        profile: general.standard.small
      exposure:
        primary: PUBLIC
      # Bindings are anchored on the consumer and keyed by the input they
      # fill, so you read them as "cacheUrl comes from the cache node's url
      # output". One input, one binding — a second origin for `cacheUrl` is a
      # conflict, not an override.
      bindings:
        cacheUrl:
          node: cache
          output: url
  parameters: {}
